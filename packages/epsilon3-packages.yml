findings:
- The API is large (209 documented endpoints across ~20 families) and has zero published
  client libraries in any language on any registry.
- Both sample clients are unversioned and unpinned, so an integration cannot lock a
  dependency or detect that the client changed underneath it.
- There is no public source repository for either client - they exist only as tarballs on
  the docs host.
