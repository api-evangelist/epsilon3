sdk_note: >-
  Epsilon3 publishes NO client SDK for its 209-endpoint REST API on any package registry.
  The only first-party distributed code is a pair of downloadable Python SAMPLE CLIENTS
  for the realtime interface. They are genuinely first-party and are the documented way to
  connect, but they are starter applications for one surface rather than an SDK for the
  API, they are not published to PyPI, and they carry no version. No SDKs pointer is
  emitted in apis.yml on the strength of them.
