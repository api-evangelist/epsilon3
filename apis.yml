apis:
- name: Epsilon3 REST API
  description: 'REST API for the Epsilon3 operations platform, organized into roughly
    twenty API families: Builds (work orders, parts, inventory, purchase and sale orders,
    vendors, tooling, shipments), Chat, Commanding, Custom Fields, Dictionaries, Events,
    External Data, Files, Issues, Procedures, Project Schedule, Roles, Runs (v1 and
    v2), Search, Settings, Skills, Snippets, Swimlanes, Telemetry, Test Management,
    and Users. Resource-oriented URLs, JSON request and response bodies, standard HTTP
    verbs and status codes, authenticated with a per-workspace API key supplied as the
    username component of HTTP Basic auth.'
  humanURL: https://docs.epsilon3.io/
