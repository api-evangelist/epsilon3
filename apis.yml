- name: Epsilon3 Realtime API
  description: 'SocketIO and webhook realtime interface for integrating third-party
    systems with running Epsilon3 procedures. Four namespaces are published: commanding
    (/v1/commands/realtime), external data (/v1/external-data/items), notifications
    (/v1/notifications/realtime) and telemetry (/v1/telemetry/realtime). Webhook deliveries
    are signed with an Epsilon3-Signature header verified against a per-workspace webhook
    key. Realtime authentication requires a team-scoped API key.'
  humanURL: https://docs.epsilon3.io/#realtime-introduction
  baseURL: https://api.epsilon3.io
  tags:
  - Real-Time
  - Webhook
  - Telemetry
  - Commanding
  tags_raw:
  - Realtime
  - Webhooks
  - Telemetry
  - Commanding
  properties:
  - type: Webhooks
    url: asyncapi/epsilon3-realtime-webhooks.yml
  - type: Documentation
    url: https://docs.epsilon3.io/#realtime-introduction
- name: Epsilon3 MCP Server
  description: 'Hosted, remote Model Context Protocol server exposing Epsilon3 procedures,
    runs, parts and inventory, and issues to MCP-capable assistants. Read-only in the
    current preview: it can search, open, query and trace records but cannot create,
    edit or delete. Authorization is OAuth 2.1 authorization-code with PKCE S256 and
    dynamic client registration, with fifteen scopes advertised via RFC 8414 and RFC
    9728 metadata; an Epsilon3 API key may also be presented as a bearer token. Regional
    endpoints are published for the UK and EU.'
  humanURL: https://www.epsilon3.io/behind-the-console/introducing-epsilon3-mcp-preview
  baseURL: https://mcp.epsilon3.io
