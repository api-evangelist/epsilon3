aid: epsilon3
name: Epsilon3
description: 'Epsilon3 is a US-based operations software provider whose platform turns
  static procedures into live, executable, auditable workflows for high-reliability
  teams in space, defense, aerospace manufacturing, and energy. The product spans procedure
  authoring and execution (runs), work orders, parts and inventory, purchase and sale
  orders, tooling and maintenance, shipments, project schedules, issues, test and requirements
  management, skills, and telemetry/commanding. Its developer surface is a per-workspace
  API-key REST API at api.epsilon3.io/v1 documented across roughly twenty API families
  and 200-plus endpoints, a SocketIO and webhook realtime interface for commanding,
  external data, notifications and telemetry streaming, and a hosted read-only Model
  Context Protocol server at mcp.epsilon3.io fronted by OAuth 2.1 with dynamic client
  registration and fifteen published scopes. Customers include NASA, Blue Origin, Redwire,
  Axiom Space and AeroVironment; deployment options span multi-tenant cloud, UK and EU
  regions, on-premises, and FedRAMP High on AWS GovCloud.'
