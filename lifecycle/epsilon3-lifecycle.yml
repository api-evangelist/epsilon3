versioning:
  scheme: uri-path
  current: v1
  also_published: v2
  docs: https://docs.epsilon3.io/#introduction
  note: >-
    v1 and v2 coexist. Roles, Users and a Runs V2 read endpoint are published under /v2
    while the rest of the surface remains /v1. Epsilon3 publishes no version-support or
    version-retirement policy, so there is no stated commitment about how long a given
    version remains callable.
  build_version_observed: v1.225.2-50b2b039
  build_version_source: >-
    window.SERVICE_VERSION in the app.epsilon3.io single-page-app shell, observed
    2026-08-12. This is the product build, not an API version.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  in_docs: true
  mechanism: >-
    Deprecation is announced in the reference itself with an explicit "Deprecated:" notice
    naming the replacement endpoint and stating the old one "will be removed in a future
    release". No removal DATE is given, and no RFC 8594 Sunset or Deprecation response
    header is documented, so a running client gets no runtime warning.
  note: >-
    Recorded as a real but informal deprecation practice: Epsilon3 does tell you what is
    going away and what to use instead, but only in prose, and only if you re-read the
    docs.
